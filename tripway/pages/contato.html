<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay | Contato</title>
</head>

<body>

    <nav>

        <a href="../index.html">TripWay</a>

        <ul>
            <li><a href="destinos.html">Destinos</a></li>
            <li><a href="pacotes.html">Pacotes</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>

    </nav>

    <main>

        <header>
            <h2>Reserve sua viagem com a gente!</h2>
        </header>

        <section>

            <form>
                <div>
                    <label for="name">Nome</label>
                    <input type="text" id="age" placeholder="Ex: João da Silva" required>

                    <label for="email">e-mail</label>
                    <input type="email" id="email" placeholder="Ex: example@example.com.br" required>
                </div>

                <div>
                    <label for="destination">Selecione o destino da sua viagem</label>
                    <select id="destination" required>
                        <option value="salvador">Salvador</option>
                        <option value="rio">Rio de Janeiro</option>
                        <option value="amazonas">Amazonas</option>
                    </select>
                </div>

                <div>
                    <label for="depart">Data de ida</label>
                    <input type="date" id="depart" required>

                    <label for="return">Data de volta</label>
                    <input type="date" id="return" required>
                </div>

                <div>
                    <label for="people">Quantas pessoas irão viajar no total?</label>
                    <input type="number" id="people" placeholder="Ex: 2" required>
                </div>

                <button type="submit">Enviar</button>

            </form>

        </section>

        <section>

            <div>
                <h3>Dúvidas? Entre em contato conosco!</h3>
            </div>

            <form>

                <div>
                    <label for="message">Mensagem</label>
                    <input type="text" id="message" placeholder="Digite aqui suas dúvidas!">
                </div>

                <button type="submit">Enviar</button>

            </form>

        </section>
    </main>

</body>

</html>
