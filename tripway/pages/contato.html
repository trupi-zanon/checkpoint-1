<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWay | Contato</title>
</head>

<body>

    <nav>

        <a href="../index.html">TripWay</a>

        <ul>
            <li><a href="destinos.html">Destinos</a></li>
            <li><a href="pacotes.html">Pacotes</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>

    </nav>

    <main>
        <section>

            <form>

                <label for="name">Nome</label>
                <input type="text" id="age" placeholder="Ex: Joâo da Silva" required>

                <label for="email">e-mail</label>
                <input type="email" id="email" placeholder="Ex: example@example.com.br" required>

                <label for="destino">Destino de interesse</label>
                <select id="destino" required>
                    <option value="salvador">Salvador</option>
                    <option value="rio">Rio de Janeiro</option>
                    <option value="amazonas">Amazonas</option>
                </select>

                <label for="date">Data</label>
                <input type="date" id="date" required>

                <label for="viajantes">Quantidade de pessoas</label>
                <input type="number" id="viajantes" placeholder="Ex: 2" required>

                <label for="message">Mensagem</label>
                <input type="text" id="message" placeholder="Digite aqui suas dúvidas!">

                <button type="submit">Enviar</button>

            </form>

        </section>
    </main>

</body>

</html>
