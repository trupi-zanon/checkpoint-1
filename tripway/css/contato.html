<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TripWay | Contato</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

<header>

    <h1 id="logo">TripWay</h1>

    <nav>

        <a href="../index.html">Home</a>
        <a href="destinos.html">Destinos</a>
        <a href="pacotes.html">Pacotes</a>
        <a href="contato.html">Contato</a>

    </nav>

</header>

<main>

<section class="contato-banner">

    <h2>Reserve sua viagem com a TripWay!</h2>

    <p>
        Planeje suas férias dos sonhos com conforto,
        segurança e os melhores pacotes.
    </p>

</section>

<section class="form-container">

    <form class="formulario">

        <h3>Solicite seu orçamento</h3>

        <label for="name">Nome Completo</label>
        <input type="text" id="name"
        placeholder="Ex: João da Silva" required>

        <label for="email">E-mail</label>
        <input type="email" id="email"
        placeholder="Ex: exemplo@gmail.com" required>

        <label for="destination">
            Destino da viagem
        </label>

        <select id="destination" required>

            <option value="">Selecione</option>
            <option value="salvador">Salvador</option>
            <option value="rio">Rio de Janeiro</option>
            <option value="amazonas">Amazonas</option>

        </select>

        <label for="depart">Data de ida</label>
        <input type="date" id="depart" required>

        <label for="return">Data de volta</label>
        <input type="date" id="return" required>

        <label for="people">
            Quantidade de pessoas
        </label>

        <input type="number" id="people"
        placeholder="Ex: 2" required>

        <label for="message">Mensagem</label>

        <textarea id="message" rows="5"
        placeholder="Digite aqui suas dúvidas"></textarea>

        <button type="submit">
            Enviar Solicitação
        </button>

    </form>

</section>

</main>

<footer>

    <p>
        © 2026 TripWay - Todos os direitos reservados.
    </p>

</footer>

</body>
</html>
